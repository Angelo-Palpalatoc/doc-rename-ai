[project]
name = "doc-rename-ai-backend"
version = "0.1.0"
description = "Hybrid OCR + deterministic rules + structured-output LLM fallback document renaming API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "pymupdf>=1.24.10",
    "onnxruntime>=1.19.0",
    "pillow>=10.4.0",
    "openpyxl>=3.1.5",
    "rapidocr>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
